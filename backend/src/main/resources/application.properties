# Server
server.port=8080

# Spring Application
spring.application.name=farmly-backend

# Default Database Configuration (H2 in-memory for instant plug-and-play offline dev & testing)
spring.datasource.url=jdbc:h2:mem:farmlydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Production PostgreSQL + PostGIS configuration (uncomment or set via ENV for Railway/Render/Docker) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/farmly
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# JWT Configuration
farmly.jwt.secret=9a3f2c4e8b1d6f0a5e7c3b2a8d4e9f1a0b3c5e7d9f2a4b6c8e0d1f3a5b7c9e1
farmly.jwt.expiration-ms=86400000

# Google Gemini API Key for Farmly AI Assistant
farmly.gemini.api-key=${GEMINI_API_KEY:demo-key}
farmly.gemini.model=gemini-1.5-flash
