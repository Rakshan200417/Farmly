# Server
server.port=8081

# Spring Application
spring.application.name=farmly-backend

# XAMPP MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/farmly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
farmly.jwt.secret=9a3f2c4e8b1d6f0a5e7c3b2a8d4e9f1a0b3c5e7d9f2a4b6c8e0d1f3a5b7c9e1
farmly.jwt.expiration-ms=86400000

# Google Gemini API Key for Farmly AI Assistant
farmly.gemini.api-key=${GEMINI_API_KEY:demo-key}
farmly.gemini.model=gemini-1.5-flash
